@if (editMode===false) {
  <span class="container">
    {{name}}
    <span class="controls">
      @if (canEdit) {
        <i class="ctrl" (click)="onEdit()" nz-icon nzType="edit" nzTheme="outline"></i>
      }
      @if (canDelete) {
        <span class="ctrl"
          nz-popconfirm
          nzPopconfirmTitle="Are you sure?"
          nzPopconfirmPlacement="bottom"
          (nzOnConfirm)="onDelete()"
          >
          <i nz-icon nzType="delete" nzTheme="outline"></i>
        </span>
      }
    </span>
  </span>
}
@if (editMode===true) {
  <span [ngClass]="{invalid: isValidPath === false}">
    <form (ngSubmit)="onSubmit()" class="container">
      <input #input name="name" [(ngModel)]="editName" spellcheck="false" maxlength="50" autocomplete="off" [attr.size]="charLength+1">
      <span class="controls">
        <i class="ctrl submit" (click)="onSubmit()" nz-icon nzType="check" nzTheme="outline"></i>
        <i class="ctrl" (click)="onCancel()" nz-icon nzType="close" nzTheme="outline"></i>
      </span>
    </form>
  </span>
}
